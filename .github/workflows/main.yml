name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check package
        run: pnpm --filter @uponu-solutions/mantine-react-table run typecheck

      - name: Test package
        run: pnpm --filter @uponu-solutions/mantine-react-table run test

      - name: Build package
        run: pnpm --filter @uponu-solutions/mantine-react-table run build

      - name: Build docs
        run: pnpm --filter @uponu-solutions/mantine-react-table-docs run build
